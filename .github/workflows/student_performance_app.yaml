# CI/CD for the Midterm Part 2 Flask app: train the model, test the app, then
# deploy the FlaskApp_StudentPerformance folder to Heroku whenever it changes.
name: Student performance app CI/CD

on:
  push:
    branches: [main]
    paths:
      - "FlaskApp_StudentPerformance/**"
      - ".github/workflows/student_performance_app.yaml"
  workflow_dispatch:

jobs:
  train-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history, needed to split out the app folder

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: FlaskApp_StudentPerformance/.python-version

      - name: Install dependencies
        working-directory: FlaskApp_StudentPerformance
        run: pip install -r requirements.txt

      - name: Train the model
        working-directory: FlaskApp_StudentPerformance
        run: python train_model.py

      - name: Test the app
        working-directory: FlaskApp_StudentPerformance
        run: python test_app.py

      - name: Deploy the app folder to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_MIDTERM_APP_NAME }}
        run: |
          if [ -z "$HEROKU_API_KEY" ] || [ -z "$HEROKU_APP_NAME" ]; then
            echo "::warning::Heroku secrets are not set yet, so the deploy step is skipped."
            exit 0
          fi
          # Include the model trained in this run (the commit stays local to the runner)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f FlaskApp_StudentPerformance/model.pkl
          git commit -m "Model trained by GitHub Actions" || echo "Model unchanged"
          SPLIT=$(git subtree split --prefix FlaskApp_StudentPerformance HEAD)
          git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" "$SPLIT:refs/heads/main"
